# TypeScript bindings generated by ts-rs during `cargo test` (see src/types/generated).
# Lives in the repository root so it applies both to `cargo … --manifest-path src-tauri/Cargo.toml`
# (npm scripts) and to cargo runs inside src-tauri.
[env]
TS_RS_EXPORT_DIR = { value = "src/types/generated", relative = true }
# serde_json writes 64-bit integers as plain JSON numbers, not BigInt.
TS_RS_LARGE_INT = "number"
