[package]
name = "otakusoul-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only"
description = "Experimentelle native Rust-Oberfläche für OtakuSoul"

[dependencies]
iced = { version = "0.14.0", features = ["image-without-codecs", "markdown", "svg"] }
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.23"
png = "0.18"
rusqlite = { version = "0.41", features = ["bundled"] }
serde_json = "1"
url = "2"
otakusoul-paths = { path = "../crates/otakusoul-paths" }
directories = "6.0"
otakusoul-macros = { path = "../crates/otakusoul-macros" }
otakusoul-prompt = { path = "../crates/otakusoul-prompt" }
otakusoul-stream = { path = "../crates/otakusoul-stream" }
reqwest = { version = "0.13", features = ["json", "stream"] }
tokio = { version = "1", features = ["rt", "time", "net", "sync", "macros"] }

[dev-dependencies]
tempfile = "3"
