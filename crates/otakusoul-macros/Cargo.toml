[package]
name = "otakusoul-macros"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only"
description = "Gemeinsame Makroauswertung ohne GUI- oder Profilabhängigkeiten"

[dependencies]
chrono = "0.4"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
ts-rs = { version = "12", features = ["serde-json-impl", "no-serde-warnings"] }
