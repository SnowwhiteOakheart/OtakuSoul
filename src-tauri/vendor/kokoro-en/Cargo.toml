[package]
edition = "2024"
name = "kokoro-en"
version = "0.1.5"
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A lightweight, offline Rust inference library for Kokoro TTS - an 82M-parameter open-weights text-to-speech model. "
readme = "README.md"
keywords = [
    "TTS",
    "Offline",
    "Lite",
    "AI",
    "Synthesizer",
]
license = "Apache-2.0"
repository = "https://github.com/pguso/kokoro.git"

[features]
default = ["g2p-espeak"]
g2p-espeak = ["misaki-rs/espeak"]
misaki-lean = []

[lib]
name = "kokoro_en"
path = "src/lib.rs"

[[bin]]
name = "kokoro-g2p-audit"
path = "src/bin/kokoro-g2p-audit.rs"

[dependencies.bincode]
version = "2.0"

[dependencies.cmudict-fast]
