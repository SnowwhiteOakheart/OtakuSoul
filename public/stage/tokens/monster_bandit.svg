    <circle cx="118" cy="214" r="2.5" fill="#9aa3ad"/>
    <circle cx="118" cy="234" r="2.5" fill="#9aa3ad"/>

    <!-- Shadowy Bandit Hood -->
    <path d="M74 134 Q68 56 128 50 Q188 56 182 134 Q194 170 178 184 L154 182 Q128 174 102 182 L78 184 Q62 170 74 134 Z" fill="#292524" stroke="#0f172a" stroke-width="2.5"/>
    <path d="M86 68 Q128 58 170 68" stroke="#44403c" stroke-width="3" fill="none"/>

