    <!-- Prominent Facial Scar Across Eyebrow -->
    <line x1="140" y1="102" x2="150" y2="124" stroke="#9f5d4c" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="142" y1="108" x2="146" y2="110" stroke="#7f1d1d" stroke-width="1.2"/>

    <!-- Cloth Mask / Bandana Covering Nose and Mouth -->
    <path d="M94 126 Q128 120 162 126 L154 172 Q128 180 102 172 Z" fill="#3f3f46" stroke="#0f172a" stroke-width="2"/>
    <path d="M96 136 Q128 130 160 136" stroke="#18181b" stroke-width="1.5" fill="none"/>
