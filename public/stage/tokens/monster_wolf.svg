<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <clipPath id="monster_wolf-clip">
      <circle cx="128" cy="128" r="120"/>
    </clipPath>
  </defs>
  <g clip-path="url(#monster_wolf-clip)">
    <!-- Background -->
    <circle cx="128" cy="128" r="120" fill="#182230"/>
    <!-- Wolf Shoulders / Thick Fur Mantle -->
    <path d="M48 248 Q76 180 128 184 Q180 180 208 248 Z" fill="#374151" stroke="#0f172a" stroke-width="2"/>
    <path d="M72 248 L96 200 L128 220 L160 200 L184 248" fill="#4b5563"/>

    <!-- Pointed Wolf Ears -->
    <polygon points="86,112 76,52 112,82" fill="#4b5563" stroke="#0f172a" stroke-width="2"/>
    <polygon points="86,104 82,66 104,86" fill="#1f2937"/>
    <polygon points="170,112 180,52 144,82" fill="#4b5563" stroke="#0f172a" stroke-width="2"/>
    <polygon points="170,104 174,66 152,86" fill="#1f2937"/>

    <!-- Fluffy Cheek Ruffs & Head Base -->
    <path d="M68 140 L92 110 Q128 84 164 110 L188 140 L164 164 L128 190 L92 164 Z" fill="#6b7280" stroke="#0f172a" stroke-width="2"/>
    <polygon points="68,140 86,134 76,156" fill="#9ca3af"/>
    <polygon points="188,140 170,134 180,156" fill="#9ca3af"/>

