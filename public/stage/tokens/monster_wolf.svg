    <circle cx="112" cy="120" r="2.5" fill="#0f172a"/>
    <polygon points="154,118 140,114 134,122 148,124" fill="#f59e0b" stroke="#0f172a" stroke-width="1.5"/>
    <circle cx="144" cy="120" r="2.5" fill="#0f172a"/>

    <!-- Snout & Growling Muzzle -->
    <polygon points="116,124 140,124 144,152 112,152" fill="#374151" stroke="#0f172a" stroke-width="1.5"/>
    <!-- Black Wet Nose -->
    <polygon points="120,146 136,146 128,154" fill="#0f172a"/>

    <!-- Snarl & Bared White Fangs -->
    <path d="M112 152 Q128 148 144 152 L140 168 Q128 174 116 168 Z" fill="#7f1d1d" stroke="#0f172a" stroke-width="1.5"/>
    <!-- Upper & Lower Fangs -->
    <polygon points="116,152 119,162 122,152" fill="#ffffff"/>
    <polygon points="134,152 137,162 140,152" fill="#ffffff"/>
    <polygon points="122,168 124,161 126,168" fill="#ffffff"/>
    <polygon points="130,168 132,161 134,168" fill="#ffffff"/>
