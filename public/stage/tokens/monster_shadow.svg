    <ellipse cx="142" cy="122" rx="7" ry="6" fill="#e0f2fe" opacity="0.8"/>
    <ellipse cx="142" cy="122" rx="4.5" ry="4" fill="#ffffff"/>
    <circle cx="142" cy="122" r="1.5" fill="#38bdf8"/>
