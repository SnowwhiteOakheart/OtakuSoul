    <ellipse cx="90" cy="132" rx="5" ry="8" fill="#fbcfe8" opacity="0.6"/>
    <ellipse cx="168" cy="132" rx="10" ry="14" fill="#fed7aa" stroke="#0f172a" stroke-width="1.8"/>
    <ellipse cx="166" cy="132" rx="5" ry="8" fill="#fbcfe8" opacity="0.6"/>

    <!-- Messy Brown Curls Framing Face -->
    <circle cx="104" cy="98" r="10" fill="#5a3d24"/>
    <circle cx="120" cy="92" r="11" fill="#78350f"/>
    <circle cx="138" cy="92" r="11" fill="#5a3d24"/>
    <circle cx="152" cy="100" r="10" fill="#78350f"/>
    <circle cx="94" cy="112" r="8" fill="#78350f"/>
    <circle cx="162" cy="112" r="8" fill="#5a3d24"/>

    <!-- Freckles & Mischievous Grin -->
    <!-- Eyes -->
    <circle cx="112" cy="126" r="4.5" fill="#0f172a"/>
    <circle cx="144" cy="126" r="4.5" fill="#0f172a"/>
    <circle cx="110" cy="124" r="1.5" fill="#ffffff"/>
    <circle cx="142" cy="124" r="1.5" fill="#ffffff"/>
    <path d="M106 118 Q114 114 120 119" stroke="#5a3d24" stroke-width="2" fill="none"/>
    <path d="M136 119 Q142 114 150 118" stroke="#5a3d24" stroke-width="2" fill="none"/>

