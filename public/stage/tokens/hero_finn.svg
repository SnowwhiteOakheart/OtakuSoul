    <rect x="60" y="174" width="26" height="6" rx="2" transform="rotate(-25 73 177)" fill="#9aa3ad" stroke="#0f172a" stroke-width="1.5"/>
    <circle cx="65" cy="148" r="4.5" fill="#c9a227" stroke="#0f172a" stroke-width="1.2"/>

