<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <clipPath id="monster_kobold-clip">
      <circle cx="128" cy="128" r="120"/>
    </clipPath>
  </defs>
  <g clip-path="url(#monster_kobold-clip)">
    <!-- Background -->
    <circle cx="128" cy="128" r="120" fill="#381c16"/>
    <!-- Ragged Leather Tunic -->
    <path d="M60 248 Q72 196 106 188 L128 194 L150 188 Q184 196 196 248 Z" fill="#573625" stroke="#0f172a" stroke-width="2"/>

    <!-- Spear Over Shoulder (Right) -->
    <line x1="168" y1="248" x2="204" y2="70" stroke="#78350f" stroke-width="5" stroke-linecap="round"/>
    <line x1="168" y1="248" x2="204" y2="70" stroke="#0f172a" stroke-width="1.5"/>
    <!-- Steel Spearhead -->
    <polygon points="204,70 196,56 206,32 216,56" fill="#9aa3ad" stroke="#0f172a" stroke-width="1.5"/>
    <line x1="206" y1="32" x2="206" y2="70" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Reptilian Rust-Red Scaly Head & Neck -->
    <rect x="110" y="150" width="36" height="34" fill="#991b1b"/>
    <!-- Snout / Head Shape -->
    <path d="M96 136 L86 116 Q128 86 170 116 L160 136 Q156 166 128 170 Q100 166 96 136 Z" fill="#b91c1c" stroke="#0f172a" stroke-width="2"/>

    <!-- Two Small Dark Horns -->
    <path d="M106 98 Q96 74 84 66 Q100 82 112 94 Z" fill="#475569" stroke="#0f172a" stroke-width="1.8"/>
    <path d="M150 98 Q160 74 172 66 Q156 82 144 94 Z" fill="#475569" stroke="#0f172a" stroke-width="1.8"/>

    <!-- Snout Ridge & Scales -->
    <path d="M112 120 Q128 114 144 120" stroke="#dc2626" stroke-width="2" fill="none"/>
    <path d="M116 130 Q128 124 140 130" stroke="#dc2626" stroke-width="2" fill="none"/>

    <!-- Reptilian Slit Eyes (Yellow/Amber) -->
    <ellipse cx="112" cy="122" rx="7" ry="6" fill="#fbbf24" stroke="#0f172a" stroke-width="1.5"/>
    <ellipse cx="112" cy="122" rx="1.5" ry="5.5" fill="#0f172a"/>
    <ellipse cx="144" cy="122" rx="7" ry="6" fill="#fbbf24" stroke="#0f172a" stroke-width="1.5"/>
    <ellipse cx="144" cy="122" rx="1.5" ry="5.5" fill="#0f172a"/>

    <!-- Reptile Snout Nostrils & Jaw Line -->
    <circle cx="122" cy="144" r="1.5" fill="#0f172a"/>
    <circle cx="134" cy="144" r="1.5" fill="#0f172a"/>
    <path d="M110 154 Q128 160 146 154" stroke="#0f172a" stroke-width="2" fill="none"/>
    <!-- Tiny Fang -->
    <polygon points="120,155 122,160 124,155" fill="#ffffff"/>
    <polygon points="132,155 134,160 136,155" fill="#ffffff"/>
  </g>
</svg>
