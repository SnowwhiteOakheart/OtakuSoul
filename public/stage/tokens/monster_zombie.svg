    <path d="M104 132 Q112 136 120 132" stroke="#365314" stroke-width="2" fill="none"/>
    <path d="M136 136 Q144 140 152 136" stroke="#365314" stroke-width="2" fill="none"/>

    <!-- Slack Sagging Jaw & Dull Expression -->
    <path d="M114 150 Q128 146 142 152 Q138 168 122 168 Q116 164 114 150 Z" fill="#1c1917" stroke="#0f172a" stroke-width="1.8"/>
    <polygon points="120,150 122,156 124,150" fill="#fef08a"/>
    <polygon points="132,152 134,157 136,152" fill="#fef08a"/>
  </g>
</svg>
