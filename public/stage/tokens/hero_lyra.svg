<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <clipPath id="hero_lyra-clip">
      <circle cx="128" cy="128" r="120"/>
    </clipPath>
  </defs>
  <g clip-path="url(#hero_lyra-clip)">
    <!-- Background -->
    <circle cx="128" cy="128" r="120" fill="#0f172a"/>
    <!-- Soft Magical Glow in Background -->
    <circle cx="128" cy="110" r="85" fill="#1e3a8a" opacity="0.35"/>
    <circle cx="192" cy="170" r="30" fill="#38bdf8" opacity="0.25"/>

    <!-- Deep Blue Robe with Gold Trim -->
    <path d="M52 248 Q64 186 100 178 L128 190 L156 178 Q192 186 204 248 Z" fill="#1e3a8a" stroke="#0f172a" stroke-width="2"/>
    <path d="M96 182 Q128 194 160 182" stroke="#e0c25a" stroke-width="3" fill="none"/>
    <line x1="128" y1="190" x2="128" y2="248" stroke="#e0c25a" stroke-width="2"/>
