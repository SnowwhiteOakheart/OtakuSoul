    <polygon points="98,110 54,92 96,124" fill="#ffedd5" stroke="#0f172a" stroke-width="1.8"/>
    <polygon points="94,110 68,98 94,118" fill="#fbcfe8" opacity="0.6"/>
    <polygon points="158,110 202,92 160,124" fill="#ffedd5" stroke="#0f172a" stroke-width="1.8"/>
    <polygon points="162,110 188,98 162,118" fill="#fbcfe8" opacity="0.6"/>

    <!-- Silver-Blue Front Hair & Bangs -->
    <path d="M84 94 Q128 62 172 94 Q162 140 152 146 Q138 106 128 116 Q118 106 104 146 Q94 140 84 94 Z" fill="#bfdbfe" stroke="#0f172a" stroke-width="2"/>
    <path d="M106 90 Q128 72 150 90" stroke="#ffffff" stroke-width="2" fill="none"/>

    <!-- Delicate Slender Violet Eyes -->
    <ellipse cx="112" cy="122" rx="7" ry="4" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>
    <circle cx="112" cy="122" r="3.5" fill="#8b5cf6"/>
    <circle cx="111" cy="121" r="1.2" fill="#ffffff"/>
    <ellipse cx="144" cy="122" rx="7" ry="4" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>
    <circle cx="144" cy="122" r="3.5" fill="#8b5cf6"/>
    <circle cx="143" cy="121" r="1.2" fill="#ffffff"/>

    <path d="M105 114 Q113 110 120 115" stroke="#6366f1" stroke-width="1.8" fill="none"/>
    <path d="M136 115 Q143 110 151 114" stroke="#6366f1" stroke-width="1.8" fill="none"/>

    <!-- Small Elf Nose & Soft Lip -->
    <path d="M127 126 L125 136 L129 136" stroke="#f43f5e" stroke-width="1.2" fill="none"/>
    <path d="M122 148 Q128 152 134 148" stroke="#e11d48" stroke-width="1.8" fill="none" stroke-linecap="round"/>

    <!-- Floating Glowing Star above Hand (Bottom Right) -->
    <!-- Hand -->
    <path d="M176 248 Q182 208 194 200 Q202 206 198 248 Z" fill="#ffedd5" stroke="#0f172a" stroke-width="1.8"/>
    <!-- Floating Star -->
    <circle cx="194" cy="174" r="14" fill="#67e8f9" opacity="0.4"/>
    <polygon points="194,158 198,170 210,174 198,178 194,190 190,178 178,174 190,170" fill="#fef08a" stroke="#e0c25a" stroke-width="1"/>
    <circle cx="194" cy="174" r="3.5" fill="#ffffff"/>
