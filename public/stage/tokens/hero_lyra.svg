    <path d="M64 96 Q52 160 60 230 Q80 210 88 160 L168 160 Q176 210 196 230 Q204 160 192 96 Z" fill="#93c5fd" stroke="#0f172a" stroke-width="2"/>

    <!-- Slender Neck & Elegant Elf Face -->
    <rect x="114" y="140" width="28" height="42" fill="#fed7aa"/>
    <polygon points="128,172 98,126 98,96 158,96 158,126" fill="#ffedd5" stroke="#0f172a" stroke-width="2"/>

