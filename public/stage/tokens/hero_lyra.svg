    <polygon points="84,216 86,210 88,216 94,218 88,220 86,226 84,220 78,218" fill="#e0c25a"/>
    <polygon points="172,216 174,210 176,216 182,218 176,220 174,226 172,220 166,218" fill="#e0c25a"/>

