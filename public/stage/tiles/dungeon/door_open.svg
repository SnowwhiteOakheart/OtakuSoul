<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Shadow of Open Door -->
  <path d="M18 10 L25 10 L25 42 L18 42 Z" fill="#0f172a" opacity="0.25"/>
  <rect x="2" y="38" width="60" height="4" fill="#0f172a" opacity="0.15"/>
  <!-- Left Stone Post -->
  <rect x="0" y="20" width="8" height="24" fill="#3b4252" stroke="#0f172a" stroke-width="1"/>
  <path d="M1 21 H7 V24 H3 V43 H1 Z" fill="#5e6779" opacity="0.6"/>
  <!-- Right Stone Post -->
  <rect x="56" y="20" width="8" height="24" fill="#3b4252" stroke="#0f172a" stroke-width="1"/>
  <path d="M57 21 H63 V24 H59 V43 H57 Z" fill="#5e6779" opacity="0.6"/>
  <!-- Hinges on Left Post -->
  <rect x="7" y="23" width="3" height="4" fill="#6b7480" stroke="#0f172a" stroke-width="0.8"/>
  <rect x="7" y="37" width="3" height="4" fill="#6b7480" stroke="#0f172a" stroke-width="0.8"/>
  <!-- Door Leaf Swung 90 Degrees Upwards -->
  <rect x="8" y="8" width="10" height="34" fill="#6b4a2f" stroke="#0f172a" stroke-width="1"/>
  <line x1="13" y1="8" x2="13" y2="42" stroke="#4a3322" stroke-width="1"/>
  <path d="M9 9 H17 V11 H9 Z" fill="#8a6240" opacity="0.7"/>
  <!-- Iron Bands on Swung Leaf -->
  <rect x="7" y="14" width="12" height="4" fill="#6b7480" stroke="#0f172a" stroke-width="0.8"/>
  <circle cx="16" cy="16" r="1" fill="#9aa3ad"/>
  <rect x="7" y="32" width="12" height="4" fill="#6b7480" stroke="#0f172a" stroke-width="0.8"/>
  <circle cx="16" cy="34" r="1" fill="#9aa3ad"/>
</svg>
