<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Shadow -->
  <rect x="14" y="14" width="40" height="37" rx="2" fill="#0f172a" opacity="0.35"/>
  <!-- Open Lid (Swung back) -->
  <rect x="12" y="10" width="40" height="10" rx="1" fill="#4a3322" stroke="#0f172a" stroke-width="1"/>
  <rect x="14" y="12" width="36" height="6" fill="#6b4a2f"/>
  <line x1="20" y1="10" x2="20" y2="20" stroke="#6b7480" stroke-width="1.5"/>
  <line x1="44" y1="10" x2="44" y2="20" stroke="#6b7480" stroke-width="1.5"/>
  <!-- Chest Body -->
  <rect x="12" y="20" width="40" height="28" rx="1" fill="#6b4a2f" stroke="#0f172a" stroke-width="1"/>
  <rect x="15" y="23" width="34" height="22" fill="#2b1a0e"/>
  <!-- Golden Treasure Glow & Coins inside -->
  <ellipse cx="32" cy="34" rx="15" ry="9" fill="#c9a227"/>
  <ellipse cx="32" cy="34" rx="12" ry="7" fill="#e0c25a"/>
  <!-- Coins & Gems -->
  <circle cx="26" cy="33" r="2.5" fill="#fef08a" stroke="#0f172a" stroke-width="0.6"/>
  <circle cx="31" cy="31" r="2.5" fill="#fef08a" stroke="#0f172a" stroke-width="0.6"/>
  <circle cx="37" cy="34" r="2.5" fill="#fef08a" stroke="#0f172a" stroke-width="0.6"/>
  <circle cx="34" cy="36" r="2" fill="#fef08a" stroke="#0f172a" stroke-width="0.6"/>
  <polygon points="28,36 30,34 32,36 30,38" fill="#ef4444" stroke="#0f172a" stroke-width="0.6"/>
  <polygon points="36,30 38,28 40,30 38,32" fill="#3b82f6" stroke="#0f172a" stroke-width="0.6"/>
  <!-- Front Lip / Iron Brackets -->
  <rect x="12" y="44" width="40" height="4" fill="#6b7480" stroke="#0f172a" stroke-width="1"/>
  <rect x="29" y="42" width="6" height="5" fill="#c9a227" stroke="#0f172a" stroke-width="1"/>
</svg>
