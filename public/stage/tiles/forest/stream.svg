<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Top Shore: Grass (y=0..16) -->
  <rect x="0" y="0" width="64" height="16" fill="#3f6b35"/>
  <path d="M0 12 Q16 10 32 13 Q48 16 64 12 V16 H0 Z" fill="#5c4329"/>
  <!-- Grass Tufts at shoreline (Seamless wrap) -->
  <polygon points="6,12 8,16 10,12" fill="#5e8f48"/>
  <polygon points="26,12 28,16 30,12" fill="#5e8f48"/>
  <polygon points="46,13 48,17 50,13" fill="#5e8f48"/>

  <!-- Stream Water Channel (y=16..48) -->
  <rect x="0" y="16" width="64" height="32" fill="#1f3f4f"/>
  <path d="M0 24 Q18 20 32 25 Q46 30 64 24 V40 Q48 44 32 39 Q16 34 0 40 Z" fill="#2f5d73" opacity="0.8"/>

  <!-- Flow Ripples & Glanzlinien (Seamless wrap at x=0 and x=64) -->
  <path d="M0 22 Q16 18 32 22 Q48 26 64 22" stroke="#3f7d95" stroke-width="1.8" fill="none"/>
  <path d="M12 22 Q24 20 36 22" stroke="#7fb3c4" stroke-width="1.2" fill="none" opacity="0.8"/>

  <path d="M0 32 Q16 36 32 32 Q48 28 64 32" stroke="#3f7d95" stroke-width="1.8" fill="none"/>
  <path d="M28 32 Q40 30 52 32" stroke="#7fb3c4" stroke-width="1.2" fill="none" opacity="0.8"/>

  <path d="M0 42 Q16 38 32 42 Q48 46 64 42" stroke="#3f7d95" stroke-width="1.8" fill="none"/>
  <path d="M8 42 Q20 40 32 42" stroke="#7fb3c4" stroke-width="1" fill="none" opacity="0.6"/>

  <!-- Bottom Shore: Grass (y=48..64) -->
  <rect x="0" y="48" width="64" height="16" fill="#3f6b35"/>
  <path d="M0 48 H64 V52 Q48 48 32 51 Q16 54 0 50 Z" fill="#5c4329"/>
  <!-- Grass Tufts at bottom shoreline -->
  <polygon points="14,52 16,48 18,52" fill="#5e8f48"/>
  <polygon points="34,51 36,47 38,51" fill="#5e8f48"/>
  <polygon points="54,52 56,48 58,52" fill="#5e8f48"/>
</svg>
