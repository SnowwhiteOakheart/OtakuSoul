<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <rect width="64" height="64" fill="#7a5c3a"/>
  <!-- Continuous Dirt Base & Texture -->
  <path d="M0 0 H64 V12 Q48 16 32 12 Q16 8 0 12 Z" fill="#6a4e30" opacity="0.5"/>
  <path d="M0 52 Q16 48 32 52 Q48 56 64 52 V64 H0 Z" fill="#6a4e30" opacity="0.5"/>

  <!-- Top Rut (y=16..24) Seamless horizontally -->
  <rect x="0" y="16" width="64" height="8" fill="#5c4329"/>
  <line x1="0" y1="16" x2="64" y2="16" stroke="#4a3322" stroke-width="1"/>
  <line x1="0" y1="24" x2="64" y2="24" stroke="#8c6b45" stroke-width="1"/>
  <!-- Subtly packed tire tread marks -->
  <line x1="8" y1="18" x2="14" y2="22" stroke="#4a3322" stroke-width="1.2"/>
  <line x1="24" y1="18" x2="30" y2="22" stroke="#4a3322" stroke-width="1.2"/>
  <line x1="40" y1="18" x2="46" y2="22" stroke="#4a3322" stroke-width="1.2"/>
  <line x1="56" y1="18" x2="62" y2="22" stroke="#4a3322" stroke-width="1.2"/>

  <!-- Bottom Rut (y=40..48) Seamless horizontally -->
  <rect x="0" y="40" width="64" height="8" fill="#5c4329"/>
  <line x1="0" y1="40" x2="64" y2="40" stroke="#4a3322" stroke-width="1"/>
  <line x1="0" y1="48" x2="64" y2="48" stroke="#8c6b45" stroke-width="1"/>
  <line x1="12" y1="42" x2="18" y2="46" stroke="#4a3322" stroke-width="1.2"/>
  <line x1="28" y1="42" x2="34" y2="46" stroke="#4a3322" stroke-width="1.2"/>
  <line x1="44" y1="42" x2="50" y2="46" stroke="#4a3322" stroke-width="1.2"/>
  <line x1="60" y1="42" x2="64" y2="45" stroke="#4a3322" stroke-width="1.2"/>

  <!-- Earth Clods / Small Pebbles in center -->
  <ellipse cx="20" cy="32" rx="2" ry="1.5" fill="#8c6b45"/>
  <ellipse cx="44" cy="31" rx="2.5" ry="1.8" fill="#8c6b45"/>
  <circle cx="34" cy="35" r="1.2" fill="#5c4329"/>
</svg>
