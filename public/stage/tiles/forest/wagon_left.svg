<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Shadow -->
  <path d="M4 36 L64 36 L64 52 L12 52 Z" fill="#0f172a" opacity="0.35"/>
  <!-- Wagon Tongue / Deichsel -->
  <rect x="2" y="30" width="22" height="4" rx="1" fill="#6b4a2f" stroke="#0f172a" stroke-width="1"/>
  <circle cx="4" cy="32" r="1.5" fill="#9aa3ad"/>

  <!-- Front Wheel (Fallen / Tilted) -->
  <ellipse cx="22" cy="32" rx="8" ry="16" fill="#4a3322" stroke="#0f172a" stroke-width="1"/>
  <ellipse cx="22" cy="32" rx="6" ry="13" fill="#6b4a2f" stroke="#0f172a" stroke-width="0.8"/>
  <!-- Spokes & Hub -->
  <line x1="22" y1="19" x2="22" y2="45" stroke="#4a3322" stroke-width="1.5"/>
  <line x1="16" y1="32" x2="28" y2="32" stroke="#4a3322" stroke-width="1.5"/>
  <circle cx="22" cy="32" r="2.5" fill="#9aa3ad" stroke="#0f172a" stroke-width="0.8"/>

  <!-- Wagon Wooden Bed / Side Frame -->
  <rect x="24" y="20" width="40" height="26" fill="#6b4a2f" stroke="#0f172a" stroke-width="1"/>
  <line x1="24" y1="26" x2="64" y2="26" stroke="#4a3322" stroke-width="1"/>
  <line x1="24" y1="34" x2="64" y2="34" stroke="#4a3322" stroke-width="1"/>
  <line x1="24" y1="41" x2="64" y2="41" stroke="#4a3322" stroke-width="1"/>

  <!-- Torn Canvas Tarp (Plane) Covering Front -->
  <path d="M30 14 Q48 11 64 13 L64 34 Q50 38 42 28 Q34 32 30 20 Z" fill="#a3835a" stroke="#0f172a" stroke-width="1"/>
  <path d="M32 16 Q48 13 64 15" stroke="#d5be9b" stroke-width="1.2" fill="none"/>
  <!-- Rips in Canvas -->
  <path d="M46 20 L50 26 L48 27" stroke="#0f172a" stroke-width="1" fill="#4a3322"/>
</svg>
