  <circle cx="23" cy="32" r="10" fill="#2f5a2a"/>

  <!-- Clump 3 (Top / Front Center) -->
  <circle cx="29" cy="24" r="14" fill="#2f5a2a" stroke="#0f172a" stroke-width="1"/>
  <circle cx="28" cy="22" r="11" fill="#3d7a34"/>
