  <circle cx="36" cy="24" r="1.8" fill="#dc2626" stroke="#0f172a" stroke-width="0.6"/>
  <circle cx="33" cy="36" r="1.6" fill="#dc2626" stroke="#0f172a" stroke-width="0.6"/>
  <circle cx="42" cy="31" r="1.6" fill="#dc2626" stroke="#0f172a" stroke-width="0.6"/>
