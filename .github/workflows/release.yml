name: Release App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Plattform zum Bauen'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - linux
          - windows

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-24.04'
            target: 'linux'
            args: '--bundles appimage,deb'
          - platform: 'windows-latest'
            target: 'windows'
            args: '--bundles nsis'

    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == '' || inputs.platform == matrix.target }}
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux Dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            libclang-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libxcb1-dev \
            libxrandr-dev \
            libdbus-1-dev \
            libwayland-dev \
            libegl-dev \
            libgbm-dev \
            libdrm-dev

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Tauri App & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'OtakuSoul v__VERSION__'
          releaseBody: 'OtakuSoul Release v__VERSION__. Herunterladen und starten:\n- Windows: `OtakuSoul_..._x64-setup.exe`\n- Linux: `OtakuSoul_..._amd64.AppImage` (oder `.deb`)'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
