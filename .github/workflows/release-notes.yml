name: Release-Notes setzen

# Setzt den Text eines bestehenden Releases aus packaging/release-notes/<tag>.md
# (der Release-Build schreibt nur einen Standardtext). Titel, Tag und Dateien bleiben.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release-Tag, z. B. v0.7.2'
        required: true
        type: string

permissions:
  contents: write

jobs:
  notes:
    name: Release-Text aus der Notes-Datei
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Release-Text setzen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Ungültiger Tag: $TAG" >&2
            exit 1
          fi
          file="packaging/release-notes/$TAG.md"
          if [ ! -f "$file" ]; then
            echo "Keine Notes-Datei: $file" >&2
            exit 1
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$file"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json name,url --jq '"\(.name): \(.url)"'
